services:
  monkey:
    build: .
    container_name: funky_monkey_friday
    restart: unless-stopped
    volumes:
      # 1. Map your bot files (persistence)
      - .:/app
      
      # 2. Map the Pi's timezone settings (Sync Time)
      # This forces the container to use the Pi's exact clock and timezone.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro